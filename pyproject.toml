[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "missa"
version = "0.7.0"
description = "Missa-Core: persönliche KI-Assistentin mit OpenAI-kompatibler API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "Louidos" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "tzdata>=2024.1",
    "caldav>=3.0,<4",
    "icalendar>=6.1",
    "recurring-ical-events>=3.3",
    "dnspython>=2.6",
    "pyyaml>=6",
]

[project.scripts]
missa-core = "missa.core.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
# Für das Einrichten neuer VMs per Playbook (auf ai01): pip install ".[vms]"
vms = [
    "ansible-core>=2.16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/missa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Gedankenstriche und Anführungszeichen in deutschen Texten sind gewollt.
ignore = ["RUF001", "RUF002", "RUF003"]
