name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruefen:
    name: Lint und Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Formatierung (ruff format)
        run: ruff format --check .

      - name: Shell-Scripts (shellcheck)
        run: shellcheck scripts/*.sh scripts/einrichten/*.sh

      - name: Tests (pytest)
        run: pytest
