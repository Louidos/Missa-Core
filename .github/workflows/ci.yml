name: CI

on:
  push:
    branches: [main]
  pull_request:

# So wenig Rechte wie möglich: die CI liest nur den Code.
permissions:
  contents: read

jobs:
  pruefen:
    name: Lint und Tests
    runs-on: ubuntu-latest
    steps:
      # Actions sind auf feste Commits festgelegt (Dependabot hält sie aktuell).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Formatierung (ruff format)
        run: ruff format --check .

      - name: Shell-Scripts (shellcheck)
        run: shellcheck scripts/*.sh scripts/einrichten/*.sh scripts/charaktertest

      - name: Bekannte Lücken in Abhängigkeiten (pip-audit)
        # Das eigene Paket "missa" steht nicht auf PyPI und wird übersprungen.
        run: pip-audit --skip-editable --progress-spinner off

      - name: Tests (pytest)
        run: pytest

  geheimnisse:
    name: Geheimnis-Suche (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.28.0"
      GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
    steps:
      # Volle Historie mit allen Branches und Tags, damit auch alte Commits geprüft werden.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks laden und prüfen
        run: |
          archiv="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archiv" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archiv"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archiv" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archiv" -C "$RUNNER_TEMP" gitleaks

      - name: Ganze Historie durchsuchen
        # --redact: gefundene Werte erscheinen nie im Log.
        run: |
          "$RUNNER_TEMP/gitleaks" git --log-opts="--all" --redact --no-banner --exit-code 1 .
